<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>
    <linearGradient id="spikeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card background -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" stroke="#4338CA" stroke-width="2"/>
  
  <!-- Subtle Surge/Pulse lines -->
  <path d="M 20 64 Q 35 64 42 45 T 58 75 T 72 30 T 88 85 T 100 64 H 108" fill="none" stroke="#6366F1" stroke-width="3" opacity="0.4" stroke-linecap="round"/>
  
  <!-- Main Spike lightning pulse -->
  <path d="M 68 22 L 40 70 H 62 L 56 106 L 90 54 H 68 Z" fill="url(#spikeGrad)" filter="url(#glow)"/>
</svg>