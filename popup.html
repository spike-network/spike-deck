<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpikeDeck - Spike Proxy Manager</title>
  <script src="popup-max-height.js"></script>
  <link rel="stylesheet" href="popup.css">
  <link rel="stylesheet" href="interaction.css">
</head>
<body class="popup-page">
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <img src="icons/icon48.png" alt="SpikeDeck" class="logo">
        <div class="title-group">
          <span class="title">SpikeDeck</span>
          <div class="status-indicator" id="status-indicator" role="status" aria-live="polite">
            <span class="status-dot offline" id="status-dot"></span>
            <span class="status-text" id="status-text">未连接</span>
          </div>
        </div>
      </div>
      
      <div class="header-actions">
        <button id="btn-modules" class="icon-btn modules-btn" title="模块" aria-label="模块" aria-expanded="false" aria-controls="modules-panel">
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
          </svg>
        </button>
        <button id="btn-refresh-providers" class="icon-btn provider-refresh-btn" title="外部资源" aria-label="外部资源" aria-expanded="false" aria-controls="providers-panel">
          <!-- Cloud + download: remote policy/ruleset sources (not a circular refresh) -->
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 14.9A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"></path>
            <path d="M12 12v9"></path>
            <path d="m8 17 4 4 4-4"></path>
          </svg>
        </button>
        <button id="btn-refresh" class="icon-btn" title="刷新列表">
          <!-- Circular arrow: reload the on-screen groups list -->
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 1 1-2.64-6.36"></path>
            <polyline points="21 3 21 9 15 9"></polyline>
          </svg>
        </button>
        <button id="btn-embedded-ui" class="icon-btn" title="打开控制台" aria-label="打开控制台">
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
            <polyline points="15 3 21 3 21 9"></polyline>
            <line x1="10" y1="14" x2="21" y2="3"></line>
          </svg>
        </button>
        <a href="tools.html" target="_blank" class="icon-btn" title="运行工具" aria-label="运行工具">
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.7 6.3a4 4 0 0 0-5-5L7.4 3.6l3 3 2.3-2.3a4 4 0 0 0 2 2z"></path>
            <path d="m5 13-3.5 3.5a2.1 2.1 0 0 0 3 3L8 16"></path>
            <path d="m9 11 4 4"></path>
            <path d="m14 10 6.5 6.5a2.1 2.1 0 0 1-3 3L11 13"></path>
          </svg>
        </a>
        <button id="btn-options" class="icon-btn" title="管理实例与设置">
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <section id="modules-panel" class="providers-panel" hidden aria-labelledby="modules-panel-title">
      <div class="providers-panel-header">
        <div class="providers-panel-title-group">
          <span id="modules-panel-title" class="providers-panel-title">模块</span>
          <span id="modules-panel-count" class="providers-panel-count"></span>
        </div>
        <button type="button" id="btn-modules-close" class="btn-provider-action" title="关闭">关闭</button>
      </div>
      <div id="modules-panel-notice" class="providers-panel-notice" role="status" aria-live="polite" hidden></div>
      <form id="module-install-form" class="module-install-form">
        <input id="module-name-input" type="text" placeholder="名称" required>
        <input id="module-url-input" type="url" placeholder="https://modules.example.test/a.sgmodule" required>
        <button type="submit" id="btn-module-install" class="btn-provider-action primary">安装</button>
      </form>
      <div id="modules-list" class="providers-list">
        <div class="providers-empty">点击加载已安装模块…</div>
      </div>
    </section>

    <!-- External Providers Panel -->
    <section id="providers-panel" class="providers-panel" hidden aria-labelledby="providers-panel-title">
      <div class="providers-panel-header">
        <div class="providers-panel-title-group">
          <span id="providers-panel-title" class="providers-panel-title">外部资源</span>
          <span id="providers-panel-count" class="providers-panel-count"></span>
        </div>
        <div class="providers-panel-actions">
          <button type="button" id="btn-providers-refresh-all" class="btn-provider-action primary" title="强制刷新全部外部资源">
            全部更新
          </button>
          <button type="button" id="btn-providers-close" class="btn-provider-action" title="关闭">
            关闭
          </button>
        </div>
      </div>
      <div id="providers-panel-notice" class="providers-panel-notice" role="status" aria-live="polite" hidden></div>
      <div id="providers-list" class="providers-list">
        <div class="providers-empty">点击加载外部资源…</div>
      </div>
    </section>

    <section class="quick-bar" aria-label="实例、运行模式与 Profile">
      <div class="quick-tabs">
        <button type="button" class="quick-tab" id="btn-quick-instance" aria-expanded="false" aria-controls="quick-panel-instance">
          <span class="quick-tab-kicker">实例</span>
          <span class="quick-tab-value" id="quick-instance-value">—</span>
        </button>
        <button type="button" class="quick-tab" id="btn-quick-outbound" aria-expanded="false" aria-controls="outbound-mode-card">
          <span class="quick-tab-kicker">模式</span>
          <span class="quick-tab-value" id="quick-outbound-value">—</span>
        </button>
        <button type="button" class="quick-tab" id="btn-quick-profile" aria-expanded="false" aria-controls="quick-panel-profile">
          <span class="quick-tab-kicker">Profile</span>
          <span class="quick-tab-value" id="quick-profile-value">—</span>
        </button>
      </div>

      <div id="quick-panel-instance" class="quick-panel" hidden>
        <div class="quick-panel-header">
          <span>切换实例</span>
          <button type="button" class="btn-provider-action" data-quick-close title="关闭">关闭</button>
        </div>
        <label for="instance-select" class="selector-label">实例</label>
        <select id="instance-select" class="instance-select" aria-label="切换实例">
          <!-- Populated dynamically -->
        </select>
      </div>

      <section id="outbound-mode-card" class="quick-panel outbound-mode-card" hidden aria-label="Spike 运行模式">
        <div class="quick-panel-header">
          <span>运行模式</span>
          <small id="outbound-mode-state">检测中…</small>
          <button type="button" class="btn-provider-action" data-quick-close title="关闭">关闭</button>
        </div>
        <div class="outbound-mode-controls">
          <button type="button" class="btn-outbound-mode" data-mode="rule">规则</button>
          <button type="button" class="btn-outbound-mode" data-mode="direct">直连</button>
          <button type="button" class="btn-outbound-mode" data-mode="global">全局</button>
          <select id="outbound-policy-select" class="outbound-policy-select" aria-label="全局代理策略">
            <option value="">加载策略…</option>
          </select>
        </div>
      </section>

      <div id="quick-panel-profile" class="quick-panel" hidden>
        <div class="quick-panel-header">
          <span>切换 Profile</span>
          <button type="button" class="btn-provider-action" data-quick-close title="关闭">关闭</button>
        </div>
        <div class="profile-switch-row">
          <label for="profile-select" class="selector-label">Profile</label>
          <select id="profile-select" class="instance-select" aria-label="切换 Profile">
            <option value="">—</option>
          </select>
          <button type="button" id="btn-profile-switch" class="btn-section-action">切换</button>
        </div>
        <div class="profile-details">
          <div class="info-row">
            <span class="info-label">路径:</span>
            <span class="info-value" id="profile-name">-</span>
            <span class="managed-badge" id="managed-badge" hidden>Managed</span>
          </div>
          <div class="info-meta" id="info-meta">
            <span class="badge" id="badge-groups">组: -</span>
            <span class="badge" id="badge-nodes">节点: -</span>
            <span class="badge" id="badge-rules">规则: -</span>
            <span class="badge" id="badge-dns-delay">DNS: —</span>
          </div>
          <div class="proxy-listener-section">
            <span class="info-label">代理监听:</span>
            <div class="proxy-listeners" id="proxy-listeners">
              <span class="proxy-listener-empty">-</span>
            </div>
          </div>
        </div>
      </div>
    </section>

    <div class="status-bar" id="status-bar">
      <div class="status-bar-main">
        <div class="proxy-toggle-wrapper" id="proxy-toggle-wrapper">
          <label class="switch-label" title="开启后由 SpikeDeck 使用当前实例监听地址接管 Chrome 代理；关闭后释放给其他扩展">
            <input type="checkbox" id="toggle-chrome-proxy">
            <span class="slider"></span>
            <span class="switch-text">接管代理</span>
          </label>
          <span class="proxy-control-dot" id="proxy-control-state" role="status" aria-live="polite" title="未接管；其他代理扩展可控制浏览器" aria-label="未接管；其他代理扩展可控制浏览器"></span>
        </div>
        <div class="traffic-row" id="traffic-row" aria-label="实时速度">
          <span class="traffic-down" id="traffic-down">↓ —</span>
          <span class="traffic-up" id="traffic-up">↑ —</span>
          <span class="traffic-total" id="traffic-total"></span>
        </div>
      </div>
    </div>

    <!-- Policy Groups Section -->
    <main class="main-content">
      <div class="section-title">
        <span>策略组</span>
        <div class="section-actions">
          <button type="button" id="btn-expand-all" class="btn-section-action" title="全部展开" aria-label="全部展开">
            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none">
              <polyline points="7 13 12 18 17 13"></polyline>
              <polyline points="7 6 12 11 17 6"></polyline>
            </svg>
          </button>
          <button type="button" id="btn-collapse-all" class="btn-section-action" title="全部收起" aria-label="全部收起">
            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none">
              <polyline points="7 11 12 6 17 11"></polyline>
              <polyline points="7 18 12 13 17 18"></polyline>
            </svg>
          </button>
          <button type="button" id="btn-toggle-hidden" class="btn-toggle-hidden" title="隐藏组已隐藏 · 点击切换为智能展示" aria-label="隐藏组展示：已隐藏">
            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path>
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path>
              <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"></path>
              <path d="M1 1l22 22"></path>
            </svg>
          </button>
          <button type="button" id="btn-filter" class="btn-section-action" title="筛选策略组 / 节点（快捷键 /）" aria-label="筛选策略组 / 节点" aria-keyshortcuts="/" aria-expanded="false" aria-controls="filter-bar">
            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </button>
        </div>
      </div>

      <div class="filter-bar" id="filter-bar" hidden>
        <input type="text" id="group-filter" class="filter-input" placeholder="筛选策略组 / 节点" autocomplete="off" spellcheck="false" aria-label="筛选策略组或节点">
        <button type="button" id="btn-filter-clear" class="filter-clear" title="清除筛选" aria-label="清除筛选">&times;</button>
      </div>

      <div id="groups-container" class="groups-container">
        <!-- Skeleton loading or dynamic groups -->
        <div class="loading-placeholder">
          <div class="spinner"></div>
          <span>正在连接…</span>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
